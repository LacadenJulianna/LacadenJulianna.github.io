<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Julianna Lacaden — Portfolio</title>
    <meta
      name="description"
      content="Julianna Lacaden — BS Computer Science student at Saint Louis University building web, desktop, and agentic AI systems."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23238636%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2714%27 fill=%27white%27 text-anchor=%27middle%27%3EJL%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="page" id="top">
      <section class="hero" aria-label="Introduction">
        <div class="hero__text">
          <p class="label" id="hero-eyebrow"></p>
          <h1 class="hero__title">Building systems that <em>quietly</em> get the work done.</h1>
          <p class="hero__bio" id="hero-bio"></p>
          <div class="btns" id="hero-links"></div>
        </div>
        <div class="hero__pic" id="hero-pic"></div>
      </section>
      <dl class="facts" id="facts"></dl>

      <section class="section" id="projects">
        <div class="section-head">
          <h2>Selected work</h2>
          <p class="label" id="projects-meta"></p>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
        <div class="works" id="works"></div>
      </section>

      <section class="section" id="about">
        <div class="section-head">
          <h2>About</h2>
        </div>
        <article class="readme">
          <div class="readme__bar">
            <span class="readme__file">julianna / README.md</span>
            <span id="readme-meta"></span>
          </div>
          <div class="readme__body">
            <div class="readme__photo" id="about-photo"></div>
            <div>
              <blockquote class="readme__quote">I build systems — from solar proposal software to AI agents.</blockquote>
              <div class="readme__text" id="about-text"></div>
            </div>
          </div>
          <div class="toolkit" id="toolkit"></div>
        </article>
      </section>

      <section class="section" id="beyond">
        <div class="section-head">
          <h2>Beyond class</h2>
          <p class="label" id="beyond-meta"></p>
        </div>
        <div class="graph" id="graph"></div>
        <ol class="ledger" id="timeline"></ol>
      </section>
    </main>

    <footer class="footer">
      <div class="page">
        <p class="label">Have something that needs building?</p>
        <p class="footer__big">Let's talk. <a id="footer-email" href="#">Email me</a> ↗</p>
        <div class="footer__bar">
          <span id="footer-copy"></span>
          <span class="footer__links" id="footer-links"></span>
          <span id="footer-place"></span>
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/lucide@1.49.0/dist/umd/lucide.min.js"
      integrity="sha384-7mWwAGEOOlxvEBR+Mpy0eVhGL+9abGHkZtVoTs+dvrWkI5g00lyMaAxRIK+rqXGt"
      crossorigin="anonymous"
    ></script>
    <script src="js/data.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
