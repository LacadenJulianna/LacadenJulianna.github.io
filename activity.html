<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity — Julianna Lacaden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%2710%27 fill=%27%233b5bfd%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27Arial%27 font-weight=%27700%27 font-style=%27italic%27 font-size=%2714%27 fill=%27white%27 text-anchor=%27middle%27%3EJL%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page" id="activity"></main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Picture viewer" hidden>
      <div class="lightbox__top">
        <button class="back" id="lightbox-close"><i data-lucide="arrow-left" aria-hidden="true"></i>Back</button>
        <span class="label" id="lightbox-count"></span>
      </div>
      <div class="lightbox__stage">
        <button class="lightbox__nav" id="lightbox-prev" aria-label="Previous picture">
          <i data-lucide="chevron-left" aria-hidden="true"></i>
        </button>
        <img id="lightbox-img" alt="" />
        <button class="lightbox__nav" id="lightbox-next" aria-label="Next picture">
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/lucide@1.49.0/dist/umd/lucide.min.js"
      integrity="sha384-7mWwAGEOOlxvEBR+Mpy0eVhGL+9abGHkZtVoTs+dvrWkI5g00lyMaAxRIK+rqXGt"
      crossorigin="anonymous"
    ></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/activity.js"></script>
  </body>
</html>
